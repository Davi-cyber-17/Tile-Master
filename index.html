<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tile Master</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wood">Tile Master</header>
<div class="hud">
  <div class="box">Pontos <b id="score">0</b></div>
  <div class="level">Nível <span id="level">1</span></div>
  <div class="box">Pares <b id="matches">0</b></div>
</div>
<main><div id="board"></div></main>
<footer class="wood-bar">
  <button id="btnShuffle" aria-label="Embaralhar"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
  <button id="btnHint" aria-label="Dica"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
  <button id="btnUndo" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
</footer>
<div id="toast"></div>
<div id="overlay"><div class="modal"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn">Continuar</button></div></div>
<script src="script.js"></script>
</body>
</html>
